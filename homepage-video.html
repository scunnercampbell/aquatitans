<!DOCTYPE html>
<html>
<head>
    <title>AquaTitans Video Banner Prototype</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; }
        .video-container { width: 100%; max-width: 1440px; height: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); padding: 20px; }
        video { width: 100%; height: auto; display: block; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay loop muted playsinline controls>
            <source src="https://github.com/scunnercampbell/aquatitans/raw/main/homepage-banner.mov" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</body>
</html>
