<!DOCTYPE html>
<html>
<head>
    <title>AquaTitans Homepage Prototype Preview</title>
    <style>
        body, html { margin: 0; padding: 0; background: #0f172a; overflow-x: hidden; }
        #slider {
            display: flex;
            transition: transform 0.4s ease;
        }
        #slider img {
            min-width: 100vw;
            width: 100vw;
            height: auto;
            display: block;
            align-self: flex-start;
        }
        #prev, #next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            z-index: 100;
            border-radius: 4px;
        }
        #prev:hover, #next:hover { background: rgba(0,0,0,0.75); }
        #prev { left: 1rem; }
        #next { right: 1rem; }
        #counter {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-family: sans-serif;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
  <button id="prev">&#8592;</button>
  <button id="next">&#8594;</button>
  <div id="counter"></div>
  <div id="slider"></div>
  <script>
    const imgs = [
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537894/app.aquatitans.test_default__3_arllgz.jpg', 
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537895/app.aquatitans.test_default_products_submersible-support-equipment.html_1_yl5a96.jpg', 
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537895/app.aquatitans.test_default_pscc-inverter-module.html_w06pdm.jpg',
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537894/app.aquatitans.test_default_about_2_xkfqwo.jpg',
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537897/app.aquatitans.test_default_about_3_sx8jbk.jpg',
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537893/app.aquatitans.test_default_amasty_quote_cart__5_aez8lh.jpg',
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537895/request-a-quote-m2.magento-demo.amasty.com_admin_amasty_quote_quote__tf8mdy.jpg',
      'https://res.cloudinary.com/dmpcjoobp/image/upload/v1781537895/request-a-quote-m2.magento-demo.amasty.com_admin_amasty_quote_quote_view_quote_id_84__vsdxbd.jpg'
    ];

    const slider = document.getElementById('slider');
    imgs.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      slider.appendChild(img);
    });

    let i = 0;

    function show(n) {
      i = (n + imgs.length) % imgs.length;
      slider.style.transform = `translateX(-${i * 100}vw)`;
      document.getElementById('counter').textContent = (i + 1) + ' / ' + imgs.length;
      window.scrollTo(0, 0);
    }

    document.getElementById('prev').addEventListener('click', () => show(i - 1));
    document.getElementById('next').addEventListener('click', () => show(i + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(i + 1);
      if (e.key === 'ArrowLeft') show(i - 1);
    });

    show(0);
  </script>
</body>
</html>
