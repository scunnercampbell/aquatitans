<!DOCTYPE html>
<html>
<head>
    <title>AquaTitans Homepage Prototype Preview</title>
    <style>
        body, html { margin: 0; padding: 0; background: #0f172a; }
        img { width: 100vw; height: auto; display: block; }
        #prev, #next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            z-index: 100;
            border-radius: 4px;
        }
        #prev:hover, #next:hover { background: rgba(255,255,255,0.3); }
        #prev { left: 1rem; }
        #next { right: 1rem; }
        #counter {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-family: sans-serif;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
  <button id="prev">&#8592;</button>
  <button id="next">&#8594;</button>
  <div id="counter"></div>
  <img id="img">
  <script>
    const imgs = [
      'https://res.cloudinary.com/dmpcjoobp/image/upload/f_auto,q_auto/v1781275930/app.aquatitans.test_default__2_olgfmi.jpg', 
      'https://res.cloudinary.com/dmpcjoobp/image/upload/f_auto,q_auto/v1781275478/app.aquatitans.test_default_products_submersible-science-equipment.html_1_djujyg.png', 
      'https://res.cloudinary.com/dmpcjoobp/image/upload/f_auto,q_auto/v1781275477/app.aquatitans.test_default_mid-water-sampler.html_ooewc3.png',
      'https://res.cloudinary.com/dmpcjoobp/image/upload/f_auto,q_auto/v1781275483/app.aquatitans.test_default_about_gdjkfq.png'
    ];
    let i = 0;

    function show(n) {
      i = (n + imgs.length) % imgs.length;
      document.getElementById('img').src = imgs[i];
      document.getElementById('counter').textContent = (i + 1) + ' / ' + imgs.length;
      window.scrollTo(0, 0);
    }

    document.getElementById('prev').addEventListener('click', () => show(i - 1));
    document.getElementById('next').addEventListener('click', () => show(i + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(i + 1);
      if (e.key === 'ArrowLeft') show(i - 1);
    });

    show(0);
  </script>
</body>
</html>
